[faketec_c3_supermini]
extends = esp32_base
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags =
  ${esp32_base.build_flags}
  -D WIFI_DEBUG_LOGGING=1
  -D MESH_PACKET_LOGGING=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -I variants/faketec_c3
  -D ESP32_CPU_FREQ=80
  -D PIN_VBAT_READ=3
  -D P_LORA_DIO_1=5
  -D P_LORA_NSS=7
  -D P_LORA_RESET=10
  -D P_LORA_BUSY=2
  -D P_LORA_SCLK=6
  -D P_LORA_MISO=1
  -D P_LORA_MOSI=0
  -D PIN_BOARD_SDA=4
  -D PIN_BOARD_SCL=8
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  -D SX126X_RXEN=9
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/faketec_c3>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}

[env:faketec_c3_repeater]
extends = faketec_c3_supermini
build_src_filter = ${faketec_c3_supermini.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${faketec_c3_supermini.build_flags}
  ${sensor_base.build_flags}
  -D ADVERT_NAME='"Faketec C3 Repeater"'
  -UENV_INCLUDE_GPS
  -UENV_INCLUDE_VL53L0X
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${faketec_c3_supermini.lib_deps}
  ${sensor_base.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:faketec_c3_mqtt_repeater]
extends = faketec_c3_supermini
build_src_filter = ${faketec_c3_supermini.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
  +<helpers/mqtt/*.cpp>
  +<helpers/web/*.cpp>
build_flags =
  ${faketec_c3_supermini.build_flags}
  ${sensor_base.build_flags}
  -D ADVERT_NAME='"Faketec C3 Repeater"'
  -UENV_INCLUDE_GPS
  -UENV_INCLUDE_VL53L0X
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_MQTT_UPLINK=1
  -D MQTT_DEFAULT_IATA='"UNSET"'
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=1
  -D WIFI_SSID='"-"'
  -D WIFI_PWD='"-"'
  -D WIFI_DEBUG_LOGGING=1
  -D MESH_PACKET_LOGGING=1
  -D MESH_DEBUG=1
  -D MQTT_DEBUG=1
lib_deps =
  ${faketec_c3_supermini.lib_deps}
  ${sensor_base.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:faketec_c3_room_server]
extends = faketec_c3_supermini
build_src_filter = ${faketec_c3_supermini.build_src_filter}
  +<../examples/simple_room_server/*.cpp>
build_flags =
  ${faketec_c3_supermini.build_flags}
  ${sensor_base.build_flags}
  -UENV_INCLUDE_GPS
  -UENV_INCLUDE_VL53L0X
  -D ADVERT_NAME='"Faketec C3 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${faketec_c3_supermini.lib_deps}
  ${sensor_base.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:faketec_c3_companion_radio_ble]
extends = faketec_c3_supermini
build_src_filter = ${faketec_c3_supermini.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/esp32/*.cpp>
build_flags =
  ${faketec_c3_supermini.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  ; -D BLE_DEBUG_LOGGING=1
  ; -D MESH_PACKET_LOGGING=1
  ; -D MESH_DEBUG=1
lib_deps =
  ${faketec_c3_supermini.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0

